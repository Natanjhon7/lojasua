<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LojaSUA</title>
    <link rel="stylesheet" href="estilo.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>🛍️ LojaSUA</h1>
                <h2>Entrar na sua conta</h2>
            </div>
            
            <form id="form-login" class="auth-form">
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="login-email" required placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="login-senha" required placeholder="Digite sua senha">
                </div>
                <button type="submit" class="btn btn-primary btn-full">Entrar</button>
            </form>
            
            <div id="login-mensagem" class="mensagem"></div>
            
            <div class="auth-footer">
                <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
    <script>
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('login-email').value;
            const senha = document.getElementById('login-senha').value;
            const msgDiv = document.getElementById('login-mensagem');
            
            const resultado = await fazerLogin(email, senha);
            
            if (resultado && resultado.success === false) {
                msgDiv.className = 'mensagem erro';
                msgDiv.innerText = resultado.message;
            }
        });
        
        (async () => {
            const usuario = await verificarSessao();
            if (usuario) {
                window.location.href = '/';
            }
        })();
    </script>
</body>
</html>
